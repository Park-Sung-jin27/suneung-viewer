ncing burnout without being bur","sourceFile":"2025학년도 6월 영어 문제.pdf","reviewStatus":"자동 패턴 초안","steps":["초반 소재: burnout, burned, hasn, last, word, spectrum","빈칸/밑줄 문장이 글에서 맡는 역할 확인","앞문장은 근거인지 문제제기인지 확인","뒤문장은 결론/재진술인지 확인","선지는 앞뒤 논리 둘 다 통과해야 선택"]},{"id":"2025-6월-22","year":2025,"session":"6월","examName":"2025학년도 6월","qid":22,"answer":4,"answerMark":"④","group":"topic","groupLabel":"주제/제목/요지/주장","type":"요지","passageType":"논설문 가능성 높음","pattern":"통념/배경 -> 전환 -> 핵심 주장","keywords":["everyone","should","speech","equal","ancient","diffusion"],"claim":"Remember, if you bring something, you should bring enough for everyone. * diffusion: 확산 ** egalitarianism: 인류 평등주의","roles":[{"text":"In both the ancient hunter-gatherer band and our intimate speech communities today, the diffusion of speech shaped values.","role":"소재 도입"},{"text":"The fact that everyone was going to be able to speak and listen had to be accommodated ethically, and it was via a rough egalitarianism.","role":"전개"},{"text":"In terms of communications, people were equal and therefore it was believed they should be equal, or at least relatively so.","role":"주제문 후보"},{"text":"By this code, ancient Big Men were not allowed to act controllingly and modern office managers are not allowed to silence anyone at will.","role":"전개"},{"text":"Moreover, equal access to speech and hearing promoted the notion that property should be held in common, that goods and food in particular should be shared, and that everyone had a duty to take care of everyone else.","role":"주제문 후보"},{"text":"This was probably more true among hunter-gatherers than it is in the modern family, circle of friends, or workplace.","role":"지시어 연결"},{"text":"But even in these cases we believe that sharing and mutual aid are right and proper.","role":"전환/반박"},{"text":"Remember, if you bring something, you should bring enough for everyone. * diffusion: 확산 ** egalitarianism: 인류 평등주의","role":"주제문 후보"}],"connectors":[{"idx":1,"terms":["it"],"sentence":"The fact  learning.","roles":[{"text":"We almost universally accept that playing video games is at best a pleasant break from a student’s learning and more often what prevents a student from accomplishing their goals.","role":"소재 도입"},{"text":"Games catch and hold attention in a way that few things can.","role":"전개"},{"text":"And yet once they have our focus, they rarely seem to offer anything meaningful to help students grow in their lives outside the games.","role":"전개"},{"text":"While this may be true for many games, we are too easily ignoring a valuable tool that could be used to enhance productivity instead of derailing it.","role":"전개"},{"text":"Rather, it is desirable that we develop games that connect to the learning outcomes we want for our students.","role":"전환/반박"},{"text":"This will enable educators to take advantage of games’ attention commanding capacities and allow our students to enjoy their games while learning.","role":"지시어 연결"}],"connectors":[{"idx":0,"terms":["their"],"sentence":"We almost universally accept that playing video games is at best a pleasant break from a student’s learning and more often what prevents a student from accomplishing their goals."},{"idx":2,"terms":["yet","they","their"],"sentence":"And yet once they have our focus, they rarely seem to offer anything meaningful to help students grow in their lives outside the games."},{"idx":3,"terms":["this","instead","it"],"sentence":"While this may be true for many games, we are too easily ignoring a valuable tool that could be used to enhance productivity instead of derailing it."},{"idx":4,"terms":["Rather","it"],"sentence":"Rather, it is desirable that we develop games that connect to the learning outcomes we want for our students."},{"idx":5,"terms":["This","their"],"sentence":"This will enable educators to take advantage of games’ attention commanding capacities and allow our students to enjoy their games while learning."}],"choices":[{"num":1,"mark":"①","text":"학습 효과 증진에 활용될 수 있는 게임을 개발해 chaos","chaotic","magnets","order"],"claim":"Nor are all nonlinear systems chaotic: to become so they need to be pushed beyond a certain point, called a bifurcation.","roles":[{"text":"A good example of chaos is the magnetic pendulum sold as an executive toy.","role":"선택문단 첫문장"},{"text":"It has four magnets arranged in a square at the base and a pendulum that swings back and forth between them.","role":"지시어 연결"},{"text":"(A) In order to produce chaos, the iteration has to be within what is called a nonlinear system.","role":"선택문단 첫문장"},{"text":"Nor are all nonlinear systems chaotic: to become so they need to be pushed beyond a certain point, called a bifurcation.","role":"주제문 후보"},{"text":"Before that point is reached they may behave in a quite orderly fashion.","role":"전개"},{"text":"(B) Release the pendulum and note the magnets that it visits, and in what order.","role":"선택문단 첫문장"},{"text":"If the pendulum is released from the same position a second time, the pattern of movement may at first be the same but soon it will become completely different.","role":"전개"},{"text":"In fact, the pattern of its movement is chaotic.","role":"전개"},{"text":"(C) No matter how much care is taken to start the pendulum in the same position, it will visit an entirely different set of points on the two occasions.","role":"선택문단 첫문장"},{"text":"Chaotic systems are generated by iteration, though not all iteration leads to chaos. [3점] * pendulum: 추(錘) ** iteration: 반복 *** bifurcation: 분기(分岐)","role":"마무리"}],"connectors":[{"idx":1,"terms":["It"],"sentence":"It has four magnets arranged in a square at the base and a pendulum that swings back and forth between them."},{"idx":3,"terms":["they"],"sentence":"Nor are all nonlinear systems chaotic: to become so they need to be pushed beyond a certain point, called a bifurcation."},{"idx":4,"terms":["they"],"sentence":"Before that point is reached they may behave in a quite orderly fashion."},{"idx":5,"terms":["it"],"sentence":"(B) Release the pendulum and note the magnets that it visits, and in what order."},{"idx":6,"terms":["but","it"],"sentence":"If the pendulum is released from the same position a second time, the pattern of movement may at first be the same but soon it will become completely different."},{"idx":7,"terms":["its"],"sentence":"In fact, the pattern of its movement is chaotic."},{"idx":8,"terms":["it"],"sentence":"(C) No matter how much care is taken to start the pendulum in the same position, it will visit an entirely different set of points on the two occasions."}],"choices":[{"num":1,"mark":"①","text":"(A) - (C) - (B)"},{"num":2,"mark":"②","text":"(B) - (A) - (C)"},{"num":3,"mark":"③","text":"(B) - (C) - (A)"},{"num":4,"mark":"④","text":"(C) - (A) - (B)"},{"num":5,"mark":"⑤","text":"(C) - (B) - (A)"}],"rawPreview":"37. A good example of chaos is the magnetic pendulum sold as an executive toy. It has four magnets arranged in a square at the base and a pendulum that swings back and forth between them. (A) In order to produce chaos, the iteration has to be within what is called a nonlinear system. Nor are all nonlinear systems chaotic: to become so they need to be pushed beyond a certain point, called a bifurcation. Before that point is reached they may behave in a quite orderly fashion. (B) Release the pendulum and note the magnets that it visits, and in what order. If the pendulum is released from the same position a second time, the pattern of movement may at first be the same but soon it will become completely different. In fact, the pattern of its movement is chaotic. (C) No matter how much care is taken to start the pendulum in the same position, it will visit an entirely different set of points","sourceFile":"2026학년도 6월 영어 문제.pdf","reviewStatus":"자동 패턴 초안","steps":["주어진 문장의 핵심 명사와 지시어 표시","(A)(B)(C) 첫 문장만 비교","대명사/연결사/반복어로 첫 연결 확정","확정 문단 후반부와 남은 첫 문장을 다시 연결","내용 연결과 문법 연결이 동시에 맞는지 확인"],"extractionNote":"순서 배열 선택지는 평가원 고정 배열 형식으로 정리함"},{"id":"2026-6월-38","year":2026,"session":"6월","exam n reason that employees give for breaking rules is that they were unaware their behavior was undesirable."},{"idx":4,"terms":["but"],"sentence":"There are some actors who knowingly act against policy, but many problems are unintentional failings."},{"idx":5,"terms":["those","their"],"sentence":"If businesses want better employees, those businesses must create clear standards and educate their employees directly about how to follow them."},{"idx":6,"terms":["these"],"sentence":"Without these standards there would be no way to distinguish bad apples from merely uninformed apples."}],"choices":[{"num":1,"mark":"①","text":"생산성 향상을 위해 기업은 직원 윤리 교육을 주기적으로 시행해야 한다."},{"num":2,"mark":"②","text":"기업은 행동 수칙에 대한 명확한 규정을 마련하여 직원을 교육해야 한다."},{"num":3,"mark":"③","text":"직원의 비윤리적 행위 예방을 위해 기업은 상벌 규정을 정비해야 한다."},{"num":4,"mark":"④","text":"근무 성과에 따른 보상을 통해 기업은 우수 직원의 이탈을 막아야 한다."},{"num":5,"mark":"⑤","text":"기업은 직원에 대한 공정한 평가를 위해 동료 평가를 실시해야 한다."}],"rawPreview":"20. 다음 글에서 필자가 주장하는 바로 가장 적절한 것은? Showing up late for work and using abusive language are the kinds of problems that every business wants to eliminate. Business leaders looking to achieve this often focus on finding “bad apples” who break their rules and then punishing them. This assumes that the bad apples are acting badly on purpose. In fact, one common reason that employees give for breaking rules is that they were unaware their behavior was undesirable. There are some actors who knowingly act against policy, but many problems are unintentional failings. If businesses want better employees, those businesses must create clear standards and educate their employees directly about how to follow them. Without these standards there would be no way to distinguish bad apples from merely uninformed apples. ① 생산성 향상을 위해 기업은 직원 윤리 교육을 주기적으로 시행해야 한다. ② 기업은 행동 수칙에 대한 명확한 규정을 마련하여 직원을 교육해야 한다. ③ 직원","sourceFile":"2026학년도 9월 영어 문제.pdf","reviewStatus":"자동 패턴 초안","steps":["초반 소재: apples, employees, problems, business, rules, businesses","논설문 가능성 높음로 먼저 가정","글쓴이의 가장 강한 의견/평가 문장 찾기","선지 표현이 지문 구조와 같은지 역추론","너무 좁은 예시 선지와 너무 넓은 배경 선지 제거"]},{"id":"2026-9월-21","year":2026,"session":"9월","examName":"2026학년도 9월","qid":21,"answer":3,"answerMark":"③","group":"blank","groupLabel":"빈칸/밑줄 의미","type":"밑줄 의미","passageType":"논설문 가능성 높음","pattern":"원인 -> 결과 -> 일반화","keywords":["music","frequency","similar","come","back","home"],"claim":"It is so important that, in spite of the large differences that exist between musical cultures, every culture we know of has the octave as the basis for its music, even if it has little else in common with other musical traditions.","roles":[{"text":"밑줄 친 come back home again이 다음 글에서 의미하는 바로 가장 적절한 것은? [3점] Here is a fundamental quality of music.","role":"소재 도입"},{"text":"Note names repeat because of a perceptual phenomenon that corresponds to the doubling and halving of frequencies.","role":"근거/인과"},{"text":"When we double or halve a frequency, we end up with a note that sounds remarkably similar to the one we started out with.","role":"전개"},{"text":"This relationship, a frequency ratio of 2:1 or 1:2, is called the octave.","role":"지시어 연결"},{"text":"It is so important that, in spite of the large differences that exist between musical cultures, every culture we know of has the octave as the basis for its music, even if it has little else in common with other musical traditions.","role":"지시어 연결"},{"text":"This phenomenon leads to the notion of circularity in pitch perception, and is similar to circularity in colors.","role":"지시어 연결"},{"text":"Although red and violet fall at opposite ends of the continuum of visible frequencies of electromagnetic energy, we see them as perceptually similar.","role":"근거/인과"},{"text":"The same is true in music, and music is often described as having two dimensions, one that accounts for tones going up in frequency and another that accounts for the perceptual sense that we’ve come back home again each time we double a tone’s frequency.","role":"근거/인과"}], uum of visible frequencies of electromagnetic energy, we see them as perceptually si","sourceFile":"2026학년도 9월 영어 문제.pdf","reviewStatus":"자동 패턴 초안","steps":["초반 소재: music, frequency, similar, come, back, home","빈칸/밑줄 문장이 글에서 맡는 역할 확인","앞문장은 근거인지 문제제기인지 확인","뒤문장은 결론/재진술인지 확인","선지는 앞뒤 논리 둘 다 통과해야 선택"]},{"id":"2026-9월-22","year":2026,"session":"9월","examName":"2026학년도 9월","qid":22,"answer":1,"answerMark":"①","group":"topic","groupLabel":"주제/제목/요지/주장","type":"요지","passageType":"설명문/논설문 판정 필요","pattern":"원인 -> 결과 -> 일반화","keywords":["social","media","capital","know","greater","relations"],"claim":"With new media, our reach of connecting is all the greater, expanding our “who you know” to greater and greater lengths. * premise: 전제","roles":[{"text":"One reason that people participate in social media is because it builds social relations.","role":"근거/인과"},{"text":"We increase our social capital when we successfully engage in social media.","role":"전개"},{"text":"Social capital describes the networks of relationships we have that are built on mutuality and sharing of identity, understanding, norms and values.","role":"전개"},{"text":"We build ties that may pay off with a job lead or a letter of recommendation.","role":"전개"},{"text":"We reinforce our identities through our online presentation in a personal blog or our profile.","role":"전개"},{"text":"“The premise behind the notion of social capital is rather simple and straightforward: investment in social relations with expected returns,” noted sociologist Nan Lin.","role":"전개"},{"text":"Lin’s work stresses that it is who you know as much as what you know that shapes our experience in society.","role":"근거/인과"},{"text":"With new media, our reach of connecting is all the greater, expanding our “who you know” to greater and greater lengths. * premise: 전제","role":"결론/주제문 후보"}],"connectors":[{"idx":0,"terms":["because","it"],"sentence":"One reason that people participate in social media is because it builds social relations."},{"idx":5,"terms":["rather"],"sentence":"“The premise behind the notion of social capital is rather simple and straightforward: investment in social relations with expected returns,” noted sociologist Nan Lin."},{"idx":6,"terms":["it"],"sentence":"Lin’s work stresses that it is who you know as much as what you know that shapes our experience in society."}],"choices":[{"num":1,"mark":"①","text":"소셜 미디어를 통한 관계망의 확장은 중요한 사회적 자본이 된다."},{"num":2,"mark":"②","text":"사회적 규범과 가치를 공유하는 것이 인간관계 형성의 기반이다."},{"num":3,"mark":"③","text":"뉴 미디어의 등장은 사회적 자본 형성의 방식을 변화시킨다."},{"num":4,"mark":"④","text":"다양한 인적 자본 구축은 소셜 미디어 활동에 필수적이다."},{"num":5,"mark":"⑤","text":"사회적 경험은 인격 함양과 세계관 확장에 도움이 된다."}],"rawPreview":"22. 다음 글의 요지로 가장 적절한 것은? One reason that people participate in social media is because it builds social relations. We increase our social capital when we successfully engage in social media. Social capital describes the networks of relationships we have that are built on mutuality and sharing of identity, understanding, norms and values. We build ties that may pay off with a job lead or a letter of recommendation. We reinforce our identities through our online presentation in a personal blog or our profile. “The premise behind the notion of social capital is rather simple and straightforward: investment in social relations with expected returns,” noted sociologist Nan Lin. Lin’s work stresses that it is who you know as much as what you know that shapes our experience in society. With new media, our reach of connecting is all the greater, expanding our “who you know” to greater and greate","sourceFile":"2026학년도 9월 영어 문제.pdf","reviewStatus":"자동 패턴 초안","steps":["초반 소재: social, media, capital, know, greater, relations","설명문/논설문 판정 필요로 먼저 가정","소재에 대해 무엇을 설명하는지 일반화","선지 표현이 지문 구조와 같은지 역추론","너무 좁은 예시 선지와 너무 넓은 배경 선지 제거"]},{"id":"2026-9월-23","year":2026,"session":"9월","examName":"2026학년도 9월","qid":23,"answer":1,"answerMark":"①","group":"topic","groupLabel":"주제/제목/요지/주장","type":"주제","passageType":"설명문/논설문 판정 필요","pattern":"통념/배경 -> 전환 -> 핵심 주장","keywords":["evidence","life","personal","acts","kinds","biographers"],"claim":"In autobiographical narratives, imaginative acts of remembering always overlap with such rhetorical acts as assertion, justification, judgment, conviction, and questioning. * archive: 기록 ** recourse: 의지 *** rhetorical: 수사적인","roles":[{"text":"In writing a life, the life narrator and the biographer engage different kinds of evidence.","role":"소재 도입"},{"text":"Most biographers incorporate multiple forms of evidence, including historical documents, interviews, and family archives, which they evaluate for validity.","role":"전개"},{"text":"Relatively few biographers use their personal memories of their subject as reliable evidence, unless they had a personal relationship to the subject of the biography (as a relative, child, friend, or colleague).","role":"근거/인과"},{"text":"For life narrators, by contrast, personal memories are the primary archival source.","role":"전개"},{"text":"They may have recourse to other kinds of sources ― letters, journals, photographs, conversations ― and to their knowledge of a historical moment.","role":"지시어 연결"},{"text":"But the usefulness of such evidence for their stories lies in the ways in which they employ that evidence to support, supplement, or offer commentary on their personalized acts of remembering.","role":"전환/반박"},{"text":"In autobiographical narratives, imaginative acts of remembering always overlap with such rhetorical acts as assertion, justification, judgment, conviction, and questioning. * archive: 기록 ** recourse: 의지 *** rhetorical: 수사적인","role":"근거/인과"}],"connectors":[{"idx":1,"terms":["they"],"sentence":"Most biographers incorporate multiple forms of evidence, including historical documents, interviews, and family archives, which they evaluate for validity."},{"idx":2,"terms":["their","they"],"sentence":"Relatively few biographers use their personal memories of their subject as reliable evidence, unless they had a personal relationship to the subject of the biography (as a relative, child, friend, or colleague)."},{"idx":4,"terms":["They","their"],"sentence":"They may have recourse to other kinds of sources ― letters, journals, photographs, conversations ― and to their knowledge of a historical moment."},{"idx":5,"terms":["But","such","their","they"],"sentence":"But the usefulness of such evidence for their stories lies in the ways in which they employ that evidence to support, supplement, or offer commentary on their personalized acts of remembering."},{"idx":6,"terms":["such"],"sentence":"In autobiographical narratives, imaginative acts of remembering always overlap with such rhetorical acts as assertion, justification, judgment, conviction, and questioning. * archive: 기록 ** recourse: 의지 *** rhetorical: 수사적인"}],"choices":[{"num":1,"mark":"①","text":"role of personal memories in different types of life storytelling"},{"num":2,"mark":"②","text":"advantages of documenting evidence-based family histories"},{"num":3,"mark":"③","text":"influence of the source types on the quality of life narratives"},{"num":4,"mark":"④","text":"similarity of data sources in describing a person’s life"},{"num":5,"mark":"⑤","text":"crucial conditions for the success of life narrators"}],"rawPreview":"23. 다음 글의 주제로 가장 적절한 것은? In writing a life, the life narrator and the biographer engage different kinds of evidence. Most biographers incorporate multiple forms of evidence, including historical documents, interviews, and family archives, which they evaluate for validity. Relatively few biographers use their personal memories of their subject as reliable evidence, unless they had a personal relationship to the subject of the biography (as a relative, child, friend, or colleague). For life narrators, by contrast, personal memories are the primary archival source. They may have recourse to other kinds of sources ― letters, journals, photographs, conversations ― and to their knowledge at leads up to the bower. The males decorate the avenue with a variety of objects, such as stones and shells. But they do not do so in a chaotic manner. The larger objects are placed closer to the bower and the smaller objects farther away. This creates a forced perspective the opposite of the Cinderella Castle; the bower appears smaller than it actually is. Endler and his colleagues suggested that the male courting in the bower now appears larger and thus more attractive to the female. Data on male mating success collected in the wild supports their hypothesis. * predator:","sourceFile":"2026학년도 9월 영어 문제.pdf","reviewStatus":"자동 패턴 초안","steps":["초반 소재: bower, males, objects, variety, modicum, mating","빈칸/밑줄 문장이 글에서 맡는 역할 확인","앞문장은 근거인지 문제제기인지 확인","뒤문장은 결론/재진술인지 확인","선지는 앞뒤 논리 둘 다 통과해야 선택"]},{"id":"2026-9월-32","year":2026,"session":"9월","examName":"2026학년도 9월","qid":32,"answer":3,"answerMark":"③","group":"blank","groupLabel":"빈칸/밑줄 의미","type":"빈칸","passageType":"논설문 가능성 높음","pattern":"원인 -> 결과 -> 일반화","keywords":["empathy","argue","critics","empathize","conflict","worse"],"claim":"Critics of empathy argue that we should give up on empathy and employ other tools in pursuit of social harmony, e.g., rational compassion or moral emotions like fear, anger, and shame. [3점] * entrench: 확립하다 ** compassion: 동정(심)","roles":[{"text":"Although empathy is widely praised by scholars and public figures, not everyone is an empathy booster.","role":"소재 도입"},{"text":"Critics of empathy argue that empathy will not save us from interpersonal and intergroup conflict.","role":"전개"},{"text":"In fact, they argue, empathy makes such conflicts worse.","role":"전개"},{"text":"These critics maintain that empathy can be exhausting and lead to burnout, insensitivity to suffering, or worse.","role":"지시어 연결"},{"text":"They argue that we tend to empathize strongly with our in-group and resist empathizing with out-groups, and even enjoy the suffering of out-groups in competitive or threatening contexts
