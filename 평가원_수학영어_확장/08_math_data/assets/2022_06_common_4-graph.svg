<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" role="img" aria-labelledby="title desc">
  <title id="title">2022학년도 6월 모의평가 수학 공통 4번 함수 그래프</title>
  <desc id="desc">x가 0보다 작을 때 0,-2의 닫힌점으로 내려오는 직선, 0과 1 사이의 y=1 수평선, x=1일 때 -1인 점, 1과 2 사이의 하강 선분, x가 2보다 클 때 2,0의 열린점에서 증가하는 직선</desc>
  <rect width="500" height="320" fill="#ffffff"/>
  <g stroke="#20252d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 160H465"/>
    <path d="M250 285V30"/>
    <path d="M465 160l-10-5m10 5-10 5"/>
    <path d="M250 30l-5 10m5-10 5 10"/>
  </g>
  <g stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="4 5" fill="none">
    <path d="M250 100H430"/>
    <path d="M310 100V220"/>
    <path d="M370 160V220"/>
    <path d="M430 100V160"/>
  </g>
  <g stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M70 100L250 280"/>
    <path d="M250 100H310"/>
    <path d="M310 160L370 220"/>
    <path d="M370 160L445 85"/>
  </g>
  <g stroke="#111827" stroke-width="2.5">
    <circle cx="250" cy="280" r="5" fill="#111827"/>
    <circle cx="250" cy="100" r="5" fill="#ffffff"/>
    <circle cx="310" cy="100" r="5" fill="#ffffff"/>
    <circle cx="310" cy="160" r="5" fill="#ffffff"/>
    <circle cx="310" cy="220" r="5" fill="#111827"/>
    <circle cx="370" cy="220" r="5" fill="#111827"/>
    <circle cx="370" cy="160" r="5" fill="#ffffff"/>
  </g>
  <g fill="#20252d" font-family="Arial, sans-serif" font-size="17">
    <text x="470" y="154">x</text>
    <text x="260" y="34">y</text>
    <text x="233" y="181">O</text>
    <text x="122" y="181">−2</text>
    <text x="304" y="181">1</text>
    <text x="364" y="181">2</text>
    <text x="424" y="181">3</text>
    <text x="230" y="106">1</text>
    <text x="224" y="226">−1</text>
    <text x="224" y="286">−2</text>
    <text x="402" y="69" font-style="italic">y=f(x)</text>
  </g>
</svg>
