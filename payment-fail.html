<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>결제 진행 중단 | JIPPI</title>
    <style>
      :root {
        --paper: #f7f1e3;
        --cream: #fffaf3;
        --ink: #171b24;
        --muted: #665b50;
        --line: #d9cdb7;
        --rust: #8b3f2b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard,
          "Noto Sans KR", sans-serif;
        line-height: 1.7;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 72px 18px;
      }
      .card {
        background: var(--cream);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 34px;
        box-shadow: 0 22px 70px rgba(45, 30, 18, 0.12);
      }
      .eyebrow {
        font-size: 0.78rem;
        font-weight: 800;
        color: var(--rust);
        letter-spacing: 0.08em;
        margin: 0 0 10px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
        letter-spacing: -0.03em;
        font-family: Georgia, "Noto Serif KR", serif;
      }
      .lead {
        color: var(--muted);
        margin: 0 0 22px;
      }
      .box {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 18px;
        margin: 18px 0;
      }
      .box span {
        display: block;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .box b {
        display: block;
        margin-top: 4px;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 22px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 12px 18px;
        text-decoration: none;
        font-weight: 800;
      }
      .primary {
        background: #211310;
        color: #fff;
      }
      .ghost {
        background: #fff;
        border: 1px solid var(--line);
        color: #7a4b1f;
      }
      @media (max-width: 640px) {
        .wrap {
          padding: 42px 14px;
        }
        .card {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <p class="eyebrow">PAYMENT STOPPED</p>
        <h1>결제가 완료되지 않았습니다.</h1>
        <p class="lead">
          결제창에서 취소되었거나 인증 중 오류가 발생했습니다. 다시 시도해도
          같은 문제가 반복되면 고객센터로 문의해 주세요.
        </p>
        <div class="box"><span>오류 코드</span><b id="code">-</b></div>
        <div class="box"><span>오류 메시지</span><b id="message">-</b></div>
        <div class="actions">
          <a class="btn primary" href="/">지피사주로 돌아가기</a>
          <a class="btn ghost" href="/suneung/">수능뷰어로 돌아가기</a>
        </div>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById("code").textContent =
        params.get("code") || "PAY_PROCESS_CANCELED";
      document.getElementById("message").textContent =
        params.get("message") ||
        "구매자가 결제창을 닫았거나 결제를 취소했습니다.";
    </script>
  </body>
</html>
