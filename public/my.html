<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>나의 리포트 보관함 | JIPPI</title>
    <style>
      :root { color-scheme:light; --ink:#24201c; --muted:#72695f; --line:#ded1bd; --paper:#fbf7ef; --green:#294338; --gold:#a6824f; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; background:radial-gradient(circle at 15% 0%,#efe4d2 0,transparent 34%),linear-gradient(180deg,#f6f0e5,#eee5d6); color:var(--ink); font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      a { color:inherit; }
      .shell { width:min(920px,calc(100% - 28px)); margin:0 auto; padding:32px 0 64px; }
      header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 4px 30px; }
      .brand { font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif; font-size:20px; font-weight:750; letter-spacing:-.04em; text-decoration:none; }
      .home { color:var(--muted); font-size:14px; text-underline-offset:5px; }
      main { overflow:hidden; border:1px solid rgba(119,88,51,.22); border-radius:30px; background:rgba(255,253,248,.88); box-shadow:0 28px 90px rgba(70,50,27,.12); backdrop-filter:blur(10px); }
      .intro { padding:52px 52px 38px; }
      .eyebrow { color:var(--gold); margin:0 0 12px; font-size:12px; font-weight:800; letter-spacing:.15em; }
      h1 { margin:0; font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif; font-size:clamp(34px,7vw,58px); line-height:1.15; letter-spacing:-.055em; text-wrap:balance; }
      .lead { max-width:610px; margin:20px 0 0; color:var(--muted); line-height:1.85; word-break:keep-all; }
      .state { border-top:1px solid var(--line); padding:36px 52px 50px; }
      .hidden { display:none!important; }
      .message { margin:0 0 18px; color:var(--muted); line-height:1.7; }
      form { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; max-width:620px; }
      input { min-height:54px; border:1px solid var(--line); border-radius:15px; background:#fff; padding:0 17px; color:var(--ink); font:inherit; font-size:16px; outline:none; }
      input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(166,130,79,.14); }
      button { min-height:54px; border:0; border-radius:15px; background:var(--green); padding:0 22px; color:#fff; font:inherit; font-weight:760; cursor:pointer; }
      button:disabled { opacity:.6; cursor:wait; }
      .status { min-height:22px; margin:12px 2px 0; color:#315d4e; font-size:13px; font-weight:650; }
      .library-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:18px; }
      .library-head h2 { margin:0; font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif; font-size:25px; letter-spacing:-.04em; }
      .identity { margin:8px 0 0; color:var(--muted); font-size:13px; }
      .logout { min-height:auto; background:transparent; color:var(--muted); padding:6px 0; text-decoration:underline; text-underline-offset:4px; }
      .reports { display:grid; gap:12px; }
      .report { display:grid; grid-template-columns:1fr auto; gap:20px; align-items:center; border:1px solid var(--line); border-radius:18px; background:#fffdf9; padding:22px 23px; text-decoration:none; transition:transform .16s ease,border-color .16s ease; }
      .report:hover { transform:translateY(-2px); border-color:#b89a70; }
      .report b { display:block; margin-bottom:7px; font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif; font-size:18px; line-height:1.45; letter-spacing:-.03em; word-break:keep-all; }
      .report span { color:var(--muted); font-size:13px; }
      .arrow { color:var(--gold)!important; font-size:24px!important; }
      .empty { border:1px dashed #cbb99e; border-radius:18px; padding:30px; color:var(--muted); line-height:1.8; text-align:center; }
      @media (max-width:640px) {
        .shell { padding-top:20px; }
        header { padding-bottom:20px; }
        main { border-radius:23px; }
        .intro { padding:37px 24px 30px; }
        .state { padding:28px 24px 38px; }
        form { grid-template-columns:1fr; }
        .library-head { align-items:flex-start; }
        .report { grid-template-columns:1fr auto; padding:19px 18px; }
      }
      @media (prefers-reduced-motion:reduce) { .report { transition:none; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header><a class="brand" href="/fortune/">JIPPI · 나의 기록</a><a class="home" href="/fortune/">운세 홈으로</a></header>
      <main>
        <section class="intro"><p class="eyebrow">MY REPORT LIBRARY</p><h1>읽었던 마음을<br>다시 찾는 곳</h1><p class="lead">저장한 리포트만 조용히 모아둡니다. 비밀번호 없이 이메일 확인 링크로 들어오고, 원래 받은 리포트 링크는 로그인 없이도 그대로 열립니다.</p></section>
        <section class="state" id="loading"><p class="message">보관함을 확인하고 있어요.</p></section>
        <section class="state hidden" id="login">
          <p class="message">저장할 때 사용한 이메일을 입력하면 20분 동안 한 번 쓸 수 있는 확인 링크를 보내드려요.</p>
          <form id="login-form" novalidate><input type="email" name="email" autocomplete="email" inputmode="email" placeholder="이메일 주소" required><button type="submit">확인 메일 받기</button></form>
          <p class="status" role="status" aria-live="polite"></p>
        </section>
        <section class="state hidden" id="library">
          <div class="library-head"><div><h2>저장한 리포트</h2><p class="identity"></p></div><button class="logout" type="button">로그아웃</button></div>
          <div class="reports"></div>
        </section>
      </main>
    </div>
    <script src="/my.js" defer></script>
  </body>
</html>
