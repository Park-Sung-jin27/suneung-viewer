<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="2027학년도 사관학교 수학 46문항 원본 문제와 검증 풀이를 보는 내부 학습 뷰어" />
    <title>2027학년도 사관학교 수학 풀이 뷰어</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #667085;
        --line: #dfe6ef;
        --soft-line: #edf1f6;
        --surface: #ffffff;
        --canvas: #f6f8fb;
        --accent: #2f6f5e;
        --accent-deep: #245849;
        --accent-soft: #eaf7f1;
        --blue: #3157a5;
        --blue-soft: #eef3ff;
        --correct: #16705b;
        --correct-soft: #e9f7f1;
        --wrong: #b23d4a;
        --wrong-soft: #fff0f2;
        --gold: #8a6324;
        --gold-soft: #fff8e8;
        --shadow: 0 18px 48px rgba(24, 39, 75, 0.08);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--canvas);
        color: var(--ink);
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        letter-spacing: -0.018em;
      }
      button, input { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; }
      button:focus-visible, input:focus-visible {
        outline: 3px solid rgba(49, 87, 165, 0.2);
        outline-offset: 2px;
      }

      .app-shell { min-height: 100vh; }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        border-bottom: 1px solid rgba(223, 230, 239, 0.9);
        background: rgba(246, 248, 251, 0.94);
        backdrop-filter: blur(14px);
      }
      .topbar__inner {
        width: min(100% - 36px, 1500px);
        min-height: 68px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }
      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 11px;
      }
      .brand__mark {
        width: 11px;
        height: 11px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 6px rgba(49, 87, 165, 0.08);
      }
      .brand__copy { min-width: 0; }
      .brand__copy strong {
        display: block;
        overflow: hidden;
        color: var(--blue);
        font-size: 0.92rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .brand__copy span {
        display: block;
        margin-top: 2px;
        color: #7a8699;
        font-size: 0.7rem;
        font-weight: 700;
      }
      .topbar__status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        flex: 0 0 auto;
        border: 1px solid #e7d8b8;
        border-radius: 999px;
        background: var(--gold-soft);
        padding: 7px 11px;
        color: var(--gold);
        font-size: 0.72rem;
        font-weight: 900;
      }

      .hero {
        width: min(100% - 36px, 1500px);
        margin: 0 auto;
        padding: 42px 0 26px;
      }
      .hero__eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.04em;
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(1.75rem, 3vw, 2.65rem);
        line-height: 1.2;
        letter-spacing: -0.055em;
      }
      .hero__lead {
        max-width: 730px;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 0.94rem;
        line-height: 1.7;
        word-break: keep-all;
      }
      .hero__facts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }
      .hero__fact {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        padding: 8px 12px;
        color: #536074;
        font-size: 0.76rem;
        font-weight: 800;
      }

      .workspace {
        width: min(100% - 36px, 1500px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
        gap: 22px;
        align-items: start;
        padding-bottom: 60px;
      }
      .catalog {
        position: sticky;
        top: 88px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--surface);
        box-shadow: 0 10px 30px rgba(24, 39, 75, 0.055);
      }
      .catalog__head {
        border-bottom: 1px solid var(--soft-line);
        padding: 18px;
      }
      .catalog__head span {
        color: #7a8699;
        font-size: 0.7rem;
        font-weight: 900;
      }
      .catalog__head strong {
        display: block;
        margin-top: 5px;
        font-size: 1rem;
      }
      .catalog__sections { padding: 10px; }
      .catalog__section-button {
        width: 100%;
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        padding: 0 10px;
        color: #4f5d72;
        cursor: pointer;
        font-size: 0.84rem;
        font-weight: 900;
        text-align: left;
      }
      .catalog__section-button:hover { background: #f7f9fc; }
      .catalog__section-button[aria-current="true"] {
        background: var(--accent-soft);
        color: var(--accent-deep);
      }
      .catalog__section-button span:last-child {
        color: #8a96a8;
        font-size: 0.7rem;
      }
      .catalog__numbers {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        padding: 2px 10px 12px;
      }
      .catalog__number {
        aspect-ratio: 1;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
        color: #69768a;
        cursor: pointer;
        font-size: 0.72rem;
        font-weight: 900;
      }
      .catalog__number:hover { border-color: #9aaac3; color: var(--ink); }
      .catalog__number[aria-current="true"] {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }
      .catalog__number[data-state="correct"]:not([aria-current="true"]) {
        border-color: #a9d8c8;
        background: var(--correct-soft);
        color: var(--correct);
      }
      .catalog__number[data-state="wrong"]:not([aria-current="true"]) {
        border-color: #edbdc3;
        background: var(--wrong-soft);
        color: var(--wrong);
      }

      .viewer { min-width: 0; }
      .viewer__progress-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        padding: 14px 18px;
      }
      .viewer__progress-copy { min-width: 0; }
      .viewer__progress-copy strong { font-size: 0.84rem; }
      .viewer__progress-copy span {
        display: block;
        margin-top: 4px;
        color: #7a8699;
        font-size: 0.7rem;
        font-weight: 700;
      }
      .viewer__progress {
        width: min(38%, 310px);
        height: 8px;
        overflow: hidden;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #e9eef4;
      }
      .viewer__progress-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), #4e9782);
        transition: width 180ms ease;
      }
      .viewer__grid {
        display: grid;
        grid-template-columns: minmax(0, 1.18fr) minmax(340px, 0.82fr);
        gap: 18px;
        align-items: start;
      }
      .card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .problem-card__top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--soft-line);
        padding: 20px 22px;
      }
      .problem-card__badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: var(--accent-soft);
        padding: 6px 9px;
        color: var(--accent-deep);
        font-size: 0.72rem;
        font-weight: 900;
      }
      .problem-card__title {
        margin: 8px 0 0;
        font-size: 1.18rem;
        line-height: 1.35;
      }
      .problem-card__meta {
        flex: 0 0 auto;
        color: #7a8699;
        font-size: 0.74rem;
        font-weight: 900;
      }
      .problem-card__image-wrap {
        overflow-x: auto;
        background: #fff;
        padding: 22px;
      }
      .problem-card__image {
        display: block;
        width: 100%;
        min-width: 0;
        height: auto;
        margin: 0 auto;
      }
      .problem-card__source {
        border-top: 1px solid var(--soft-line);
        padding: 12px 22px;
        color: #8994a5;
        font-size: 0.66rem;
        font-weight: 700;
        line-height: 1.5;
      }

      .study-panel { position: sticky; top: 88px; }
      .study-panel__answer {
        border-bottom: 1px solid var(--soft-line);
        padding: 20px;
      }
      .study-panel__eyebrow {
        margin: 0;
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 900;
      }
      .study-panel h2 {
        margin: 6px 0 0;
        font-size: 1.08rem;
        letter-spacing: -0.035em;
      }
      .answer-choices {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin-top: 16px;
      }
      .answer-choice {
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: #4f5d72;
        cursor: pointer;
        font-weight: 900;
      }
      .answer-choice:hover { border-color: #9aaac3; }
      .answer-choice[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent-deep);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .short-answer {
        width: 100%;
        min-height: 50px;
        margin-top: 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        padding: 0 14px;
        color: var(--ink);
        font-size: 1rem;
        font-weight: 800;
      }
      .answer-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .action-button {
        min-height: 48px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 0.84rem;
        font-weight: 900;
      }
      .action-button:disabled { cursor: not-allowed; opacity: 0.45; }
      .action-button--primary { border: 0; background: var(--accent); color: #fff; }
      .action-button--primary:hover:not(:disabled) { background: var(--accent-deep); }
      .action-button--secondary { border: 1px solid var(--line); background: #fff; color: #536074; }
      .action-button--secondary:hover { border-color: #9aaac3; }
      .answer-result {
        margin-top: 12px;
        border-radius: 13px;
        padding: 13px 14px;
        font-size: 0.82rem;
        font-weight: 900;
        line-height: 1.5;
      }
      .answer-result--correct { background: var(--correct-soft); color: var(--correct); }
      .answer-result--wrong { background: var(--wrong-soft); color: var(--wrong); }
      .answer-result--neutral { background: var(--blue-soft); color: var(--blue); }

      .solution {
        max-height: calc(100vh - 335px);
        overflow-y: auto;
        padding: 20px;
        overscroll-behavior: contain;
      }
      .solution--locked {
        min-height: 240px;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .solution__placeholder {
        max-width: 260px;
        color: #7a8699;
        font-size: 0.82rem;
        line-height: 1.65;
        word-break: keep-all;
      }
      .solution__placeholder strong {
        display: block;
        margin-bottom: 8px;
        color: #536074;
        font-size: 0.92rem;
      }
      .solution__verify {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 15px;
        color: var(--correct);
        font-size: 0.68rem;
        font-weight: 900;
      }
      .solution__verify::before {
        content: "✓";
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--correct-soft);
      }
      .solution__concept {
        display: inline-flex;
        border-radius: 999px;
        background: var(--blue-soft);
        padding: 6px 9px;
        color: var(--blue);
        font-size: 0.7rem;
        font-weight: 900;
      }
      .solution__answer {
        margin: 10px 0 0;
        font-size: 1.42rem;
        letter-spacing: -0.045em;
      }
      .solution-block {
        margin-top: 16px;
        border-top: 1px solid var(--soft-line);
        padding-top: 16px;
      }
      .solution-block h3 {
        margin: 0 0 8px;
        color: #46556d;
        font-size: 0.78rem;
      }
      .solution-block p {
        margin: 0;
        color: #536074;
        font-size: 0.82rem;
        line-height: 1.68;
        word-break: keep-all;
      }
      .solution-steps {
        display: grid;
        gap: 9px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .solution-step {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        gap: 9px;
        align-items: start;
        color: #46556d;
        font-size: 0.8rem;
        line-height: 1.62;
      }
      .solution-step__number {
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent-deep);
        font-size: 0.68rem;
        font-weight: 900;
      }
      .solution-note {
        margin-top: 12px;
        border-radius: 13px;
        padding: 12px 13px;
      }
      .solution-note strong {
        display: block;
        margin-bottom: 4px;
        font-size: 0.7rem;
      }
      .solution-note p { font-size: 0.76rem; }
      .solution-note--trap { background: var(--gold-soft); }
      .solution-note--trap strong { color: var(--gold); }
      .solution-note--transfer { background: #f2f5fa; }
      .solution-note--transfer strong { color: var(--blue); }

      .viewer__navigation {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }
      .nav-button {
        min-height: 50px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        color: #536074;
        cursor: pointer;
        font-size: 0.84rem;
        font-weight: 900;
      }
      .nav-button:hover:not(:disabled) { border-color: #9aaac3; color: var(--ink); }
      .nav-button:disabled { cursor: not-allowed; opacity: 0.45; }

      .error-state {
        width: min(100% - 36px, 680px);
        margin: 80px auto;
        border: 1px solid #edbdc3;
        border-radius: 18px;
        background: #fff;
        padding: 28px;
        color: var(--wrong);
        text-align: center;
      }

      @media (max-width: 1120px) {
        .workspace { grid-template-columns: 210px minmax(0, 1fr); }
        .viewer__grid { grid-template-columns: minmax(0, 1fr); }
        .study-panel { position: static; }
        .solution { max-height: none; }
      }

      @media (max-width: 780px) {
        .topbar__inner, .hero, .workspace { width: min(100% - 28px, 100%); }
        .topbar__status { display: none; }
        .hero { padding-top: 28px; }
        .workspace { display: block; }
        .catalog {
          position: static;
          margin-bottom: 14px;
          border-radius: 18px;
        }
        .catalog__head { display: none; }
        .catalog__sections {
          display: flex;
          gap: 7px;
          overflow-x: auto;
          padding: 10px;
          scrollbar-width: none;
        }
        .catalog__sections::-webkit-scrollbar { display: none; }
        .catalog__section-button {
          width: auto;
          min-width: max-content;
          flex: 0 0 auto;
          padding: 0 12px;
        }
        .catalog__numbers {
          display: flex;
          overflow-x: auto;
          padding: 0 10px 10px;
          scrollbar-width: none;
        }
        .catalog__numbers::-webkit-scrollbar { display: none; }
        .catalog__number { width: 38px; height: 38px; flex: 0 0 auto; aspect-ratio: auto; }
      }

      @media (max-width: 480px) {
        .topbar__inner { min-height: 60px; }
        .brand__copy span { display: none; }
        .hero { padding: 22px 0 18px; }
        .hero h1 { font-size: 1.62rem; }
        .hero__lead { margin-top: 10px; font-size: 0.82rem; line-height: 1.62; }
        .hero__facts { margin-top: 14px; }
        .hero__fact { padding: 7px 10px; font-size: 0.68rem; }
        .viewer__progress-card { padding: 12px 14px; }
        .viewer__progress { width: 34%; }
        .card { border-radius: 18px; box-shadow: 0 10px 28px rgba(24, 39, 75, 0.065); }
        .problem-card__top { padding: 16px; }
        .problem-card__title { font-size: 1.02rem; }
        .problem-card__image-wrap { padding: 12px 8px; }
        .problem-card__source { padding: 10px 14px; }
        .study-panel__answer, .solution { padding: 16px; }
        .answer-choice { min-height: 46px; }
        .answer-actions { grid-template-columns: 1fr; }
        .solution-step { font-size: 0.78rem; }
        .viewer__navigation { position: sticky; bottom: 10px; z-index: 10; }
        .nav-button { min-height: 48px; box-shadow: 0 8px 24px rgba(24, 39, 75, 0.1); }
      }

      @media print {
        .topbar, .hero, .catalog, .viewer__progress-card, .study-panel__answer, .viewer__navigation { display: none !important; }
        body { background: #fff; }
        .workspace, .viewer__grid { display: block; width: 100%; }
        .card { border: 0; box-shadow: none; }
        .study-panel { margin-top: 20px; }
        .solution { display: block !important; max-height: none; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-shell" aria-live="polite"></div>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
